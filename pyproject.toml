[project]
name = "first-rag"
version = "0.1.0"
description = "Personal learning-memory RAG: plugin-based collection, LLM distillation, Qdrant storage, filtered semantic search"
requires-python = ">=3.13"
dependencies = [
    "qdrant-client",
    "openai",
    "fastapi",
    "uvicorn",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mutmut",
    "radon",
    "pre-commit",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# --- 覆盖率：变异测试与 CRAP 的共同输入 ---
[tool.coverage.run]
source = ["src"]
branch = false
omit = ["*/scripts/*"]
# 让 coverage.xml 里的 filename 带子目录，CRAP 才能对上文件
# （插件目录里有一堆 __init__.py，光靠 basename 会撞车）
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

[tool.coverage.xml]
output = "coverage.xml"

# --- 变异测试：mutmut ---
# 全库跑变异太慢（数千个变异体 × 十几秒测试），默认只打核心链路；
# 想换目标就改下面的 only_mutate，mutmut 3.x 的范围只能在配置里定。
[tool.mutmut]
source_paths = ["src/"]
# 打的是"改坏了会静默出问题"的链路：宪法 VII 点名的手写核心（ids /
# similarity / ark_client / distill_prompt）+ 幂等入库与编排（ingest / sync）
# + 宪法 V 的脱敏边界（sanitize —— 它只有 26 行，24 个变异体，跑批多花不到
# 一分钟，但那是「密钥会不会进 LLM」的闸门，值得）+ 三条主流程（ask / collect
# / distill）。想全量就把这行删掉。
#
# 2026-09-24 加进 distill_batches：装箱算错会让一整批素材静默不蒸馏，正是
# 这一类。没加 secret_patterns —— 它只有模块级的正则常量、零个函数，mutmut
# 生不出变异体，加进去只会让"文件数"看着涨了而数字没动。
#
# 注意：加文件进去必须**整个重建** mutants/（`mv mutants /tmp/…`），
# mutmut 3.x 不会为新增文件补生成变异体（连 collect 子命令都没有），
# 不然你会以为覆盖扩大了，其实数字没动。
only_mutate = [
    "src/ids.py",
    "src/similarity.py",
    "src/ark_client.py",
    "src/distill_prompt.py",
    "src/ingest.py",
    "src/sync.py",
    "src/sanitize.py",
    "src/ask.py",
    "src/collect.py",
    "src/distill.py",
    "src/distill_batches.py",
]
pytest_add_cli_args = ["-x", "-q", "--no-header", "-p", "no:cacheprovider"]
# mutants/ 是独立的工作副本：config/ 是测试要读的 schema.json；scripts/ 是因为
# tests/unit/ 下有脚本单测（test_baseline_check 等）要 import 它们 —— 少了这条，
# mutmut 会在收集 stats 阶段因 import 失败而整个跑不起来（踩过：加完脚本单测后
# make mutation 直接挂掉，而 mutmut 不在 pre-commit 里，没有任何门禁会发现）。
# .pre-commit-config.yaml 同理：test_gate_selftest 要拿它核对"用例表和真实配置
# 有没有各走各的"，而测试文件里的 REPO_ROOT 在副本里指向 mutants/ 自己。
# Makefile 同理：test_makefile_forwarding 要读它核对"参数有没有真的转发给 CLI"。
# 同一个坑踩了两次，记住：**任何测试要读仓库根的文件，都必须进 also_copy**。
# 2026-09-24 第三次踩，还是我自己：test_path_literals 要核对 PRD.md 里的文件名，
# 而 PRD.md 没进这份名单 → make mutation 在收集 stats 阶段就 FileNotFoundError
# 崩掉，报的还是"runner returned 1"这种看不出根因的错。
# 现在的兜底做法：改完任何读仓库根文件的测试，跑一次
# `grep -rn 'REPO_ROOT / ' tests/` 对照这份名单，缺一行就补一行。
also_copy = ["config/", "scripts/", ".pre-commit-config.yaml", "Makefile", "PRD.md"]
do_not_mutate = ["src/plugins/_template/*"]
# 按源码行排除，两类：
# 1. 纯文案行 —— 拼给 LLM 的 JSON 字段名、示例文本、日志格式串。改这些不会
#    改变程序行为，测试要杀掉它们只能把整段文案抄进断言里，维护成本远高于
#    收益。变异测试该验证逻辑，不是验证文案。
# 2. 已证等价的行 —— 改了行为不变，因此**任何**测试都杀不死。
#    每条都必须写清"为什么等价"和它的前提，前提变了这条排除就跟着失效。
#
# **排除的单位是"行"，不是"变异"**：命中后该行的所有变异体都不再生成。
# 所以每条 pattern 都得先回答"这行除了我想排除的东西，还有没有别的逻辑？"
# 否则就是拿"报告里少一个噪声"换"永久关掉一个真信号"。
# 反面教材（本仓库真踩过，别再犯）：曾用 `"utf-8"` 这种"包含"式 pattern
# 排除编码名，结果连坐了同行的 `open(inbox, "a", …)`（"a" → "w" 会让快记
# 被覆盖）与 `.splitlines()` —— 那两行从此再不被变异检验，而报告上看不出
# 任何异常。同类问题还有 `[\["]` 这种宽松写法，连坐了带推导式的真实 payload
# 行（`"citations": [asdict(c) …]`、`"materials": [vars(m) | …]`）。
# **判据：宁可留一个等价变异体在报告里当"已知存活"，也不要关掉一整行。**
do_not_mutate_patterns = [
    # 给 LLM 看的素材示例文本（只命中 distill_prompt 拼 prompt 的那 5 行）。
    '^\s*"[a-z_]+":\s*material\.[a-z_]+(\.[a-z_]+\(\))?\s*,$',
    # 纯字符串字面量值的行（`"role": "user",` 这种）。必须限定"整行就是一个
    # 字符串字面量"，否则带列表推导式的真实 payload 行会被连坐。
    '^\s*"[a-z_]+":\s*"[^"]*",?\s*$',
    '^\s*(logger|logging)\.(info|warning|error|debug)\(',
    '^\s*logging\.basicConfig\(',
]
# 下面这些**已证等价但故意不排除**（前提是会变的，写死排除会把将来变回真信号
# 的那一条永久盖住；留在报告里当"已知存活"更诚实，README 里也逐条列了）：
#   - similarity.filter_novel 的 `search_limit = len(...) + 1` → `+ 2`：
#     Qdrant 返回点去重且按分数降序，批次内只有 N 个不同 ID，第 N+1 位必定是
#     批次外的点；多要槽位只会拿到排在它后面、分数更低的结果，next() 取到的
#     还是同一个。**但同一行的 `- 1` / 删掉是危险方向**（批次会占满结果集、
#     把真重复挤出去，去重静默失效），那条有测试盯着 —— 所以这行绝不能整行
#     排除，否则危险方向也一起退出检验。
#   - ingest.upsert 传给 filter_novel 的 `collection_name`：filter_novel 里是
#     `collection_name or config.COLLECTION`，所以"写成 None"和"整个删掉"两个
#     变体都等价。这行的文本和同一函数里 client.upsert 那处一模一样，按行排除
#     没法只挑一个 —— 而 client.upsert 那处是有断言盯着的（写错 collection
#     就会查到/写到别的集合去），不该被连坐。
#   - sync.main 的 `ensure_ascii=False`：summary 目前全是 ASCII 字段，
#     True / None / 省略都等价。一旦 summary 里出现中文就不再等价。
#   - distill._direct_type 里 `note_type` 的默认值 "reflection"：大写
#     "REFLECTION" 不在 schema 的 type 名里，同样会走兜底，结果一致。
#   - 编码名大小写（`"utf-8"` → `"UTF-8"`，codec 查找大小写不敏感）：只值
#     2 个变异体，不值得为它关掉 21 行。
