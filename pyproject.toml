[project]
name = "first-rag"
version = "0.1.0"
description = "Personal learning-memory RAG: plugin-based collection, LLM distillation, Qdrant storage, filtered semantic search"
requires-python = ">=3.13"
dependencies = [
    "qdrant-client",
    "openai",
    "fastapi",
    "uvicorn",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
