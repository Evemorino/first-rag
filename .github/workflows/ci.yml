# 提交门禁的第二层。
#
# 这里跑的**不是**另一套检查，而是同一套：`.pre-commit-config.yaml` 那 15 个钩子
# （14 拦人 + 1 个 post-commit 提醒），外加 `scripts/gate_selftest.py`（门禁自检）。
# 分工是——
#
#   pre-commit：本地，快，但 `--no-verify` 就能绕，而且换台机器 / 换一个
#               agent 会话没跑过 `make hooks` 就等于没有。本项目经常并行开
#               好几个会话，这不是假想敌。
#   CI：       绕不过去。它不生产任何新的判断标准，只保证「你说装了门禁，
#               那它在干净环境里确实会红」。
#
# 最后那条 gate-selftest 才是这个文件存在的重点：门禁自己坏了的时候（脚本改错、
# files 过滤器写宽、钩子配置没生效），pre-commit 会一路绿着放行，而 CI 也一样绿
# —— 除非有人去证明"植入违规它真的会红"。这一层把那个证明搬到了机器上。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      # Python 版本按 mise.toml（3.13）。
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      # uv 由 setup-uv 装，版本读 mise.toml —— 钉版本的活儿留在那一处，不在这里
      # 抄一份。这里踩过一次：本文件最初写的是 `pip install uv==0.29.1`，那是
      # 照抄当时 mise.toml 里的值，而 mise.toml 后来已经换成 0.12.5 —— 第二处
      # 版本就是这么烂掉的（CI 13 秒即红）。
      #
      # action 一律按 commit SHA 钉，不写 @v10：major tag 会飘，上游发个新版就把
      # CI 改红，而红的原因跟你的代码毫无关系。代价是升级要手动 —— 对只有一个人
      # 的项目，这个方向上的错已经犯过一次了。
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      # 钩子的 entry 是 `uv run --no-sync ...` —— 它假定虚拟环境已经在那儿，
      # 所以必须先 sync 一次，否则每个钩子都死在找不到解释器上。
      - run: uv sync --group dev

      # Qdrant 直接用仓库里那份 docker-compose.yml：集成测试要连 :6333
      # （连不上是 skip，不是 fail —— 但那就等于 CI 上没人跑过 AC-003 的幂等）。
      # 在 CI 里再抄一份 services: 就是第二份配置真相，早晚和 compose 分叉。
      - run: docker compose up -d
      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:6333/ >/dev/null 2>&1; then
              echo "Qdrant is up"; exit 0
            fi
            sleep 1
          done
          echo "Qdrant 没在 60s 内起来" >&2
          docker compose logs --tail 40 >&2
          exit 1

      - name: 跑全部提交门禁（pre-commit 阶段那 14 个）
        run: uv run pre-commit run --all-files

      - name: 门禁自检 —— 植入违规，证明每个钩子还会红
        run: uv run python scripts/gate_selftest.py
