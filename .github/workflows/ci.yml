# 提交门禁的第二层。
#
# 这里跑的**不是**另一套检查，而是同一套：`.pre-commit-config.yaml` 那 18 个钩子
# （外加 1 个 post-commit 提醒），以及 `scripts/gate_selftest.py`（门禁自检）。
# 分工是——
#
#   pre-commit：本地，快，但 `--no-verify` 就能绕，而且换台机器 / 换一个
#               agent 会话没跑过 `make hooks` 就等于没有。本项目经常并行开
#               好几个会话，这不是假想敌。
#   CI：       绕不过去。它不生产任何新的判断标准，只保证「你说装了门禁，
#               那它在干净环境里确实会红」。
#
# 最后那条 gate-selftest 才是这个文件存在的重点：门禁自己坏了的时候（脚本改错、
# files 过滤器写宽、钩子配置没生效），pre-commit 会一路绿着放行，而 CI 也一样绿
# —— 除非有人去证明"植入违规它真的会红"。这一层把那个证明搬到了机器上。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      # Python 版本按 mise.toml（3.13）。
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      # uv 由 setup-uv 装，版本读 mise.toml —— 钉版本的活儿留在那一处，不在这里
      # 抄一份。这里踩过一次：本文件最初写的是 `pip install uv==0.29.1`，那是
      # 照抄当时 mise.toml 里的值，而 mise.toml 后来已经换成 0.12.5 —— 第二处
      # 版本就是这么烂掉的（CI 13 秒即红）。
      #
      # action 一律按 commit SHA 钉，不写 @v10：major tag 会飘，上游发个新版就把
      # CI 改红，而红的原因跟你的代码毫无关系。代价是升级要手动 —— 对只有一个人
      # 的项目，这个方向上的错已经犯过一次了。
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      # 钩子的 entry 是 `uv run --no-sync ...` —— 它假定虚拟环境已经在那儿，
      # 所以必须先 sync 一次，否则每个钩子都死在找不到解释器上。
      - run: uv sync --group dev

      # Qdrant 直接用仓库里那份 docker-compose.yml：集成测试要连 :6333
      # （连不上是 skip，不是 fail —— 但那就等于 CI 上没人跑过 AC-003 的幂等）。
      # 在 CI 里再抄一份 services: 就是第二份配置真相，早晚和 compose 分叉。
      - run: docker compose up -d
      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:6333/ >/dev/null 2>&1; then
              echo "Qdrant is up"; exit 0
            fi
            sleep 1
          done
          echo "Qdrant 没在 60s 内起来" >&2
          docker compose logs --tail 40 >&2
          exit 1

      # --- v0.9 前端（ADR-21 / NFR-012）---
      #
      # 位置变了：Node / pnpm / 依赖 / 浏览器内核**搬到了提交门禁之前**。v0.9 起的
      # 提交钩子里有三条前端钩子（eslint / tsc / vitest），gate-selftest 还多了一对
      # 真跑浏览器的用例 —— 前置不做完，那两步会因为"找不到 pnpm / 没装内核"而红，
      # 而那种红是环境问题、不是代码问题（自检会用退出码 2 把它和"拦住了"分开）。
      #
      # Node 版本从 mise.toml 读，**不在 CI 里另抄一份** —— 这个文件踩过：最初写的
      # `pip install uv==<当时 mise.toml 里的值>` 在 mise.toml 升级后 13 秒即红。
      - name: 读 Node 版本（mise.toml 是唯一事实来源）
        id: node-version
        run: |
          echo "version=$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('mise.toml').read_text())['tools']['node'])")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      # pnpm 版本同样不在这里写死：action 会读 web/package.json 的 packageManager 字段。
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          package_json_file: web/package.json

      - name: 前端依赖（lockfile 冻结）
        run: pnpm --dir web install --frozen-lockfile

      # 产物不入库，所以每次都得真的建出来：早一步撞出构建问题，比等浏览器内核装完、
      # 到 e2e 的 webServer 里才撞出来便宜。
      - name: 前端构建（顺带证明产物能从零构建出来）
        run: pnpm --dir web build

      - name: Playwright 浏览器内核
        run: pnpm --dir web exec playwright install --with-deps chromium

      # v0.9 起这 18 个钩子里含前端三条（eslint / tsc / vitest）—— 原先单独的
      # "前端三门"步骤删掉了：钩子已经跑过同一套命令，再跑一遍只是让 CI 更慢。
      - name: 跑全部提交门禁（pre-commit 阶段那 18 个）
        run: uv run pre-commit run --all-files

      - name: 门禁自检 —— 植入违规，证明每个钩子（含浏览器冒烟那条）还会红
        run: uv run python scripts/gate_selftest.py

      # 8 步验收要真后端 + 真 Qdrant（上面已经起过），Playwright 的 webServer 会自己拉 uvicorn。
      - name: 8 步验收（AC-018~021）
        run: pnpm --dir web e2e

      - name: 类型快照必须与 openapi.json 一致（防字段两侧漂移）
        run: |
          make ui-types
          git diff --exit-code -- web/src/api/schema.d.ts
